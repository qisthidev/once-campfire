services:
  web:
    build: .
    ports:
      - "3000:80"
    environment:
      - RAILS_ENV=production
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite3:storage/db/production.sqlite3
    volumes:
      - sqlite_data:/rails/storage/db
      - rails_tmp:/rails/tmp
      - rails_log:/rails/log
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: redis-server --appendonly yes

volumes:
  sqlite_data:
  redis_data:
  rails_tmp:
  rails_log: